- name: Deploy to EC2 Minikube
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            sudo kubectl set image deployment/devopstermproject \
              devopstermproject=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/devopstermproject:latest
            sudo kubectl rollout restart deployment/devopstermproject
            sudo kubectl rollout status deployment/devopstermproject
            pkill -f "kubectl port-forward" || true
            nohup sudo kubectl port-forward --address 0.0.0.0 service/devopstermproject-service 30080:3000 > /tmp/portforward.log 2>&1 &
            sleep 3
            echo "Deployment complete!"