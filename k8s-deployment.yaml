apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopstermproject
  labels:
    app: devopstermproject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devopstermproject
  template:
    metadata:
      labels:
        app: devopstermproject
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: devopstermproject
        image: 869435311503.dkr.ecr.us-east-1.amazonaws.com/devopstermproject:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devopstermproject-service
spec:
  type: NodePort
  selector:
    app: devopstermproject
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30080
